name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore Korp.sln

      - name: Build
        run: dotnet build Korp.sln --no-restore --configuration Release

      - name: Run unit tests (Estoque)
        run: dotnet test tests/Korp.Estoque.UnitTests/Korp.Estoque.UnitTests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=estoque-results.trx"

      - name: Run unit tests (Faturamento)
        run: dotnet test tests/Korp.Faturamento.UnitTests/Korp.Faturamento.UnitTests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=faturamento-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/*.trx'

  frontend:
    name: Frontend (Angular 21)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Build production
        run: npm run build -- --configuration production
        working-directory: src/frontend

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Check for vulnerable NuGet packages
        run: dotnet list Korp.sln package --vulnerable --include-transitive
        continue-on-error: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: npm audit (frontend)
        run: npm audit --audit-level=high
        working-directory: src/frontend
        continue-on-error: true
