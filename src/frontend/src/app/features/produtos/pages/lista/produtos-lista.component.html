<div class="page-header">
  <h1 class="page-title">Produtos</h1>
  <a mat-fab extended routerLink="novo" color="primary">
    <mat-icon>add</mat-icon>
    Novo Produto
  </a>
</div>

@if (loading()) {
  <div class="loading-container">
    <mat-spinner diameter="48" />
  </div>
} @else if (produtos().length === 0) {
  <div class="empty-state">
    <mat-icon class="empty-icon">inventory_2</mat-icon>
    <p>Nenhum produto cadastrado.</p>
    <a mat-stroked-button routerLink="novo">Cadastrar primeiro produto</a>
  </div>
} @else {
  <div class="table-card">
    <table mat-table [dataSource]="produtos()">
      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let p"><strong>{{ p.codigo }}</strong></td>
      </ng-container>

      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell *matCellDef="let p">{{ p.descricao }}</td>
      </ng-container>

      <ng-container matColumnDef="saldo">
        <th mat-header-cell *matHeaderCellDef>Saldo</th>
        <td mat-cell *matCellDef="let p">
          <span [class]="p.saldo === 0 ? 'saldo-zero' : 'saldo-ok'">{{ p.saldo }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let p" class="acoes-cell">
          <a mat-icon-button [routerLink]="[p.id, 'editar']" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button color="warn" (click)="confirmarDelete(p)" matTooltip="Excluir">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row"></tr>
    </table>
  </div>
}
