services:
  postgres:
    image: postgres:16-alpine
    container_name: korp_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-korp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-korp}
    ports:
      - "5432:5432"
    volumes:
      - korp_pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-korp} -d ${POSTGRES_DB:-korp}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  korp_pgdata:
